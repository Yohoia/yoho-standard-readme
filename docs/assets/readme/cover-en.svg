<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">A project introduction with a deliberate visual identity</title>
  <desc id="desc">An editorial README wordmark beside document sketches and English/Chinese tabs. Conceptual artwork, not a product screenshot.</desc>
  <rect width="960" height="300" rx="12" fill="#f3efe6"/>
  <path d="M32 38H928" stroke="#cfc9bc"/>
  <circle cx="43" cy="38" r="6" fill="#c64a30"/>
  <text x="40" y="148" font-family="Arial,Helvetica,sans-serif" font-size="94" font-weight="800" letter-spacing="-6" fill="#233fba">README</text>
  <text x="44" y="212" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="500" letter-spacing="-1" fill="#222c30">Made for your project.</text>
  <path d="M44 252H496" stroke="#233fba" stroke-width="3"/>
  <g transform="translate(644 64) rotate(-9 100 96)">
    <rect width="174" height="194" rx="5" fill="#233fba"/>
    <rect x="23" y="27" width="94" height="13" rx="3" fill="#f3efe6"/>
