    <path d="M22 85H150M22 104H150M22 123H116" stroke="#d6d2c9" stroke-width="6"/>
  </g>
  <rect x="614" y="211" width="126" height="55" rx="6" fill="#202c30"/>
  <text x="677" y="250" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" fill="#fffdf8">EN</text>
  <rect x="751" y="211" width="151" height="55" rx="6" fill="#c64a30"/>
  <text x="826" y="250" text-anchor="middle" font-family="Arial,PingFang SC,sans-serif" font-size="35" font-weight="600" fill="#fffdf8">中文</text>
</svg>
